[project]
name = "delaylens-backend"
version = "0.1.0"
description = "DelayLens API: departure curves, live arrivals and Ask DelayLens"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2,<4",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests", "ingest/tests"]
pythonpath = ["."]
markers = ["live_db: explicitly opted-in real Tiger Data transaction rollback tests"]
